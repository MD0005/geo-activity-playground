name: Build and Push to GHCR

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".github/workflows/sync-upstream-and-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Read package version
        id: package
        run: |
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the project version from pyproject.toml."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.package.outputs.version }}
          tags: |
            ghcr.io/md0005/geo-activity-playground:latest
          platforms: linux/arm64

