name: Sync upstream and build image

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-upstream-and-build.yml"
  schedule:
    - cron: "30 2 * * *" # codziennie 02:30 UTC, czyli 04:30 w Polsce latem

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/martin-ueding/geo-activity-playground.git
          git fetch upstream main

          BEFORE=$(git rev-parse HEAD)

          if ! git merge --no-edit upstream/main; then
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)

            if [ "${#CONFLICTS[@]}" -ne 1 ]; then
              echo "::error::Upstream merge has conflicts that require manual review."
              git status --short
              git merge --abort
              exit 1
            fi

            case "${CONFLICTS[0]}" in
              .github/workflows/build-and-push.yml)
                # Git detected the fork's ARM64 workflow as a rename of the
                # upstream release workflow. Preserve both under separate names.
                git show :2:.github/workflows/build-and-push.yml > .github/workflows/build-and-push.yml
                git show :3:.github/workflows/build-and-push.yml > .github/workflows/ghcr_build.yml
                git add .github/workflows/build-and-push.yml .github/workflows/ghcr_build.yml
                ;;
              .github/workflows/ghcr_build.yml)
                # Git treated the same history as an upstream modification of a
                # file deleted by the fork. Keep upstream's release workflow;
                # the fork's ARM64 workflow already has its independent path.
                git add .github/workflows/ghcr_build.yml
                ;;
              *)
                echo "::error::Unexpected conflict in ${CONFLICTS[0]}."
                git status --short
                git merge --abort
                exit 1
                ;;
            esac

            git commit --no-edit
          fi

          AFTER=$(git rev-parse HEAD)

          if [ "$BEFORE" != "$AFTER" ]; then
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read package version
        id: package
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the project version from pyproject.toml."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.package.outputs.version }}
          tags: ghcr.io/md0005/geo-activity-playground:latest
          platforms: linux/arm64

