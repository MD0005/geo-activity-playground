name: Sync upstream and build image

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *" # codziennie 02:30 UTC, czyli 04:30 w Polsce latem

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync from upstream
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/martin-ueding/geo-activity-playground.git
          git fetch upstream main

          BEFORE=$(git rev-parse HEAD)

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-ff --no-commit upstream/main; then
            mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
            UNEXPECTED_CONFLICTS=()

            for conflict in "${CONFLICTS[@]}"; do
              case "$conflict" in
                .github/workflows/*) ;;
                *) UNEXPECTED_CONFLICTS+=("$conflict") ;;
              esac
            done

            if [ "${#UNEXPECTED_CONFLICTS[@]}" -ne 0 ]; then
              echo "::error::Upstream merge has conflicts that require manual review: ${UNEXPECTED_CONFLICTS[*]}"
              git status --short
              git merge --abort
              exit 1
            fi
          fi

          # GITHUB_TOKEN cannot push upstream changes to workflow files. Keep
          # the fork's workflows unchanged and sync the rest of the project.
          mapfile -t FORK_WORKFLOWS < <(git ls-tree -r --name-only "$BEFORE" -- .github/workflows)

          for workflow in "${FORK_WORKFLOWS[@]}"; do
            git checkout "$BEFORE" -- "$workflow"
          done

          mapfile -t MERGED_WORKFLOWS < <(git ls-files .github/workflows | sort -u)

          for workflow in "${MERGED_WORKFLOWS[@]}"; do
            if ! git cat-file -e "$BEFORE:$workflow" 2>/dev/null; then
              git rm -f -- "$workflow"
            fi
          done

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "::error::Unresolved conflicts remain after isolating workflow files."
            git status --short
            git merge --abort
            exit 1
          fi

          git commit --no-edit
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Read package version
        id: package
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the project version from pyproject.toml."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.package.outputs.version }}
          tags: ghcr.io/md0005/geo-activity-playground:latest
          platforms: linux/arm64


