name: Build and Push to GHCR

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # publish-release creates the GitHub release only after the version has
      # already been published to PyPI, so by the time this runs the
      # Dockerfile's `pip install geo-activity-playground==VERSION` is
      # guaranteed to find it.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/geo-activity-playground:latest
            ghcr.io/${{ github.repository_owner }}/geo-activity-playground:${{ github.event.release.tag_name }}
